plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = '1.21.1'
        mappingsVersion = '2024.11.17'
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            gameDirectory = project.file('run')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        // Every @GameTest headlessly, non-zero exit on failure. Its own directory: runs that share
        // run/ share run/mods, which is how Portable Beacons' tests once loaded a dev-only mod and
        // all failed on its join-time packet.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            gameDirectory = project.file('run-gametest')
        }
        // 1.21.1 has a single datagen run; clientData()/serverData() only exist from 1.21.4 on.
        data {
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            // gameDirectory is set per run, not here: configureEach would overwrite the game test
            // run's own directory depending on when each run is realised.
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Puts Minecraft on the test classpath, for the core/ tests that touch types like ResourceKey.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

repositories {
    maven {
        name = 'BlameJared (JEI)'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

configurations {
    // Mods to drop into the dev run folder. See copyDevMods below.
    devMods
}

dependencies {
    // For testing by hand only - JEI to read recipes, Jade to read a table at a glance, Mekanism for
    // FE (its creative energy cube) and cables. None is required to play.
    devMods "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    devMods "maven.modrinth:jade:${jade_version}"
    devMods "maven.modrinth:mekanism:${mekanism_version}"

    // JEI and Jade integrations compile against them; both stay optional, each behind a plugin class
    // only that mod ever loads.
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    compileOnly "maven.modrinth:jade:${jade_version}"

    // Pure-logic classes under core/ are plain Java and unit-testable.
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Gradle 9 stopped putting the launcher on the test runtime classpath itself.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

/**
 * Puts the dev-only mods where FML finds them: a jar on the run classpath loads but is never
 * registered as a mod, FML discovers mods from mods/. Portable Beacons' lesson, kept as-is.
 *
 * A Sync rather than a Copy, so run/mods holds exactly this list; only jars that are mods, since
 * JEI publishes its internals as dependencies that raise "not a valid mod file" on every launch.
 * The game test run has its own directory and never sees them.
 */
var copyDevMods = tasks.register('copyDevMods', Sync) {
    from configurations.devMods.filter { jar ->
        new java.util.zip.ZipFile(jar).withCloseable { it.getEntry('META-INF/neoforge.mods.toml') != null }
    }
    into file('run/mods')
}

tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
    dependsOn copyDevMods
}

// Expand gradle.properties into neoforge.mods.toml so versions live in one place.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into "${layout.buildDirectory.get()}/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
// Generated resources are committed, so a clone builds without running datagen first.
sourceSets.main.resources.srcDir 'src/generated/resources'
neoForge.ideSyncTask generateModMetadata

// Both licences travel with the jar: a distributed artifact that does not carry its own terms
// leaves a pack author guessing.
tasks.named('jar', Jar) {
    from(file('LICENSE')) { into 'META-INF' }
    from(file('LICENSE-ASSETS')) { into 'META-INF' }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs << '-Xlint:deprecation'
}
